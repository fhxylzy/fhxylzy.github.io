<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo title=false %}
  <title>{{ site.title | default: site.github.repository_name }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <nav class="page-nav" aria-label="Page navigation">
        <a href="{{ "/" | absolute_url }}">Home</a>
        <a href="#about-me">About</a>
        <a href="#research-interest">Research</a>
        <a href="#publications">Publications</a>
        <a href="#scholarship">Scholarship</a>
        <a href="#honor">Honors</a>
      </nav>
      <aside class="site-sidebar" aria-label="Profile">
        <header class="site-header">
          <img src="{{site.logo | relative_url}}" alt="Logo" />
          <div class="sidebar-links">
            <p class="view"><a href="{{ site.github.owner_url }}">GitHub</a></p>
            <p class="view"><a href="https://www.yuque.com/zylee">Blog</a></p>
          </div>
        </header>
        <footer class="site-footer">
          <p class="site-footer__motto"><span aria-hidden="true">&infin;</span> Unlimited Progress</p>
          <p class="site-footer__updated">Updated <time datetime="{{ site.time | date: '%Y-%m' }}">{{ site.time | date: "%Y%m" }}</time></p>
        </footer>
      </aside>
      <main class="site-content">
      {{ content }}

      </main>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
