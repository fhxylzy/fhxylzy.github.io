<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo title=false %}
  <title>{{ site.title | default: site.github.repository_name }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <img src="{{site.logo | relative_url}}" alt="Logo" />
        <p class="view" style="margin-bottom: 1px;"><a href="{{ site.github.owner_url }}">View My GitHub</a></p>
        <p class="view" style="margin-top: 1px;"><a href="https://www.yuque.com/zylee">View My Blog</a></p>
      </header>
      <section>

      <nav class="page-nav" aria-label="页面跳转">
        <a href="{{ "/" | absolute_url }}">首页</a>
        <a href="#about-me">关于我</a>
        <a href="#research-interest">研究方向</a>
        <a href="#publications">论文</a>
        <a href="#scholarship">奖学金</a>
        <a href="#honor">荣誉</a>
        <a href="{{ site.github.owner_url }}">GitHub</a>
        <a href="https://www.yuque.com/zylee">博客</a>
      </nav>

      {{ content }}

      </section>
      <footer>
        <p><small>Unlimited Progress &mdash; updated {{ site.time | date: "%Y%m" }}</small></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
